<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog & Catatan - Web Portfolio</title>

    <!-- Anti-Flash Script (Deteksi Tema Sistem/Storage) -->
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', saved || system);
        })();
    </script>

    <!-- Lucide Icons & CSS Utama -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

    <style>
        /* Format Rata Kanan-Kiri (Justify) Khusus Artikel Blog */
        .blog-card-excerpt,
        .post-prose,
        .post-prose p,
        .post-prose div {
            text-align: justify;
            text-justify: inter-word;
        }

        .post-prose h2, 
        .post-prose h3, 
        .post-prose h5,
        .post-prose h7 {
            text-align: left;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        /* Styling Toolbar Search & Chips */
        .blog-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .blog-search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
            max-width: 360px;
            display: flex;
            align-items: center;
        }

        .blog-search-box input {
            width: 100%;
            padding: 8px 14px 8px 38px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .blog-search-box input:focus {
            border-color: var(--primary-color);
        }

        .blog-search-box [data-lucide] {
            position: absolute !important;
            left: 12px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            color: var(--text-dim) !important;
            width: 16px !important;
            height: 16px !important;
            pointer-events: none;
        }

        .blog-categories {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .blog-categories::-webkit-scrollbar {
            display: none;
        }

        .blog-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 0.78rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .blog-chip.active {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
            font-weight: 600;
        }

        /* Detail Artikel Wrap */
        .post-detail-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            max-width: 850px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-color);
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 10px;
            text-decoration: none;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }

        .post-detail-cover {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 12px;
            margin: 16px 0;
            border: 1px solid var(--border-color);
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
        }

        /* GRID & CARD BLOG STYLING */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .blog-card {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .blog-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-color);
            box-shadow: 0 6px 16px rgba(0, 242, 254, 0.12);
        }

        .blog-card-thumb-wrapper,
        .thumb {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
        }

        .blog-card-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .blog-card:hover .blog-card-thumb {
            transform: scale(1.04);
        }

        .blog-card-body {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .blog-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            color: var(--primary-color);
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .blog-meta span {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .blog-meta [data-lucide] {
            width: 12px !important;
            height: 12px !important;
        }

        .blog-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-color);
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.2s ease;
        }

        .blog-card:hover .blog-card-title {
            color: var(--primary-color);
        }

        .blog-card-excerpt {
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.4;
            margin-bottom: 10px;
            flex-grow: 1;
            text-align: justify;
            text-justify: inter-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .blog-card-footer {
            margin-top: auto;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .blog-read-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--primary-color);
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            transition: gap 0.2s ease;
        }

        .blog-read-btn [data-lucide] {
            width: 12px !important;
            height: 12px !important;
        }

        .blog-card:hover .blog-read-btn {
            gap: 6px;
        }

        @media (max-width: 600px) {
            .blog-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .blog-card-body {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <!-- BACKGROUND CANVAS -->
    <canvas id="particleCanvas"></canvas>

    <!-- NAVBAR RESMI -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand"><i data-lucide="terminal"></i> Dev<span>Portfolio</span></a>
        
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html"><i data-lucide="home"></i> Home & About</a></li>
            <li><a href="skills.html"><i data-lucide="code-2"></i> Skills</a></li>
            <li><a href="projects.html"><i data-lucide="folder-git-2"></i> Projects</a></li>
            <li><a href="certificates.html"><i data-lucide="award"></i> Certificates</a></li>
            <li><a href="videos.html"><i data-lucide="video"></i> Videos</a></li>
            <li><a href="blog.html" class="active"><i data-lucide="newspaper"></i> Blog</a></li>
        </ul>

        <div class="nav-actions">
            <button id="themeToggle" class="theme-toggle-btn" aria-label="Ganti Tema">
                <div class="theme-icon-wrapper">
                    <i data-lucide="sun" class="theme-icon sun-icon"></i>
                    <i data-lucide="moon" class="theme-icon moon-icon"></i>
                </div>
            </button>

            <button id="mobileMenuToggle" class="mobile-menu-toggle" aria-label="Buka Menu">
                <i data-lucide="menu"></i>
            </button>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="page-container container">
        <section id="homeView">
            <h1 class="page-title"><i data-lucide="newspaper"></i> Catatan & Artikel Blog</h1>

            <div class="blog-toolbar">
                <div class="blog-search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="searchInput" placeholder="Cari judul atau kata kunci artikel...">
                </div>
                <div class="blog-categories" id="chips"></div>
            </div>

            <div class="blog-grid" id="blogGrid"></div>
            <div class="pagination-container" id="pagination"></div>
        </section>

        <section id="postView" style="display: none;">
            <a href="#" class="back-btn"><i data-lucide="arrow-left"></i> Kembali ke Daftar Artikel</a>
            <article class="post-detail-wrapper">
                <h1 id="postTitle" style="font-size: 1.6rem; color: var(--text-color); line-height: 1.3;"></h1>
                <div class="blog-meta" style="margin-top: 10px; color: var(--primary-color);" id="postMeta"></div>
                <img id="postCover" class="post-detail-cover" src="" alt="Cover Artikel">
                <div class="post-prose" id="postBody" style="color: var(--text-dim); line-height: 1.7;"></div>
                <div class="post-tags" id="postTags" style="display:flex; gap:6px; margin-top:20px;"></div>
            </article>
        </section>
    </main>

    <!-- CONTAINER WIDGET AI UNTUK DI-INJECT OLEH AI-ASSISTANT.JS -->
    <div id="aiWidgetContainer"></div>

    <!-- JAVASCRIPT KONEKSI -->
    <script src="js/main.js"></script>
    <script src="js/blog/blog-data.js"></script>
    <script src="js/blog/blog.js"></script>
    
    <!-- SCRIPT UTAMA AI ASSISTANT -->
    <script src="js/ai-assistant.js"></script>
    <!-- Pustaka membaca file Excel di Browser -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</body>
</html>
