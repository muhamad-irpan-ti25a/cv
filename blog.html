<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog & Catatan - Web Portfolio</title>

    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', saved || system);
        })();
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        [data-aos] {
            opacity: 1 !important;
            transform: none !important;
            transition: none !important;
            animation: none !important;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            contain: layout paint;
            min-height: 400px;
        }

        .blog-card {
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.15);
            border-radius: 16px;
            overflow: hidden;
            will-change: transform;
            transform: translateZ(0); 
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease !important;
        }

        .blog-card:hover {
            transform: translateY(-4px) translateZ(0);
            border-color: #00f2fe;
        }

        .thumb {
            display: block;
            width: 100%;
            height: 200px;
            aspect-ratio: 16 / 9;
            background-color: rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }

        .blog-card-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .blog-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .blog-search-box {
            position: relative;
            flex: 1;
            min-width: 260px;
            max-width: 400px;
        }

        .blog-search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 20px;
            color: inherit;
            font-size: 0.9rem;
            outline: none;
        }

        .blog-search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            width: 18px;
            height: 18px;
        }

        .blog-categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .blog-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: inherit;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .blog-chip.active {
            background: #00f2fe;
            color: #020617;
            border-color: #00f2fe;
            font-weight: 600;
        }

        .blog-card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* Efek placeholder halus saat gambar sedang dimuat */
.thumb {
    display: block;
    width: 100%;
    height: 200px;
    aspect-ratio: 16 / 9;
    background: rgba(255, 255, 255, 0.05); /* Latar belakang sementara */
    overflow: hidden;
}

.blog-card-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    animation: fadeInImg 0.3s ease-in-out forwards; /* Muncul mulus saat selesai load */
}

@keyframes fadeInImg {
    from { opacity: 0; }
    to { opacity: 1; }
}

        /* Merapikan Meta Info (Ikon & Teks Sejajar Sempurna) */
.blog-meta, #postMeta {
    font-size: 0.82rem;
    color: #00f2fe;
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center; /* Menyejajarkan teks & ikon secara vertikal */
    gap: 8px 12px;
    line-height: 1;
}

.blog-meta span, #postMeta span {
    display: inline-flex;
    align-items: center; /* Memastikan isi di dalam span berada di tengah */
    gap: 5px;            /* Jarak antara ikon dan teks */
}

/* Memastikan ukuran ikon SVG konsisten dan presisi */
.blog-meta svg, #postMeta svg,
.blog-meta [data-lucide], #postMeta [data-lucide] {
    width: 14px !important;
    height: 14px !important;
    display: inline-block;
    vertical-align: middle;
    flex-shrink: 0;
}

        .blog-card-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        .blog-card-excerpt {
            font-size: 0.88rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 16px;
            flex-grow: 1;
        }

        .blog-card-footer {
            margin-top: auto;
        }

        .blog-read-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #00f2fe;
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
        }

        .post-detail-wrapper {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 20px;
            padding: 28px;
            max-width: 900px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 8px 16px;
            border-radius: 12px;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .post-detail-cover {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 14px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .post-prose {
            line-height: 1.8;
            color: #cbd5e1;
            font-size: 0.98rem;
        }

        .post-prose h2 { font-size: 1.5rem; color: #00f2fe; }
        .post-prose h3 { font-size: 1.3rem; color: #f8fafc; }
        .post-prose h5 { font-size: 1.1rem; color: #38bdf8; }
        .post-prose p { margin-bottom: 16px; }

        .post-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .post-tag-item {
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 32px;
        }

        .page-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: inherit;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand"><i data-lucide="terminal"></i> Dev<span>Portfolio</span></a>
        <ul class="nav-links">
            <li><a href="index.html"><i data-lucide="home"></i> Home & About</a></li>
            <li><a href="skills.html"><i data-lucide="code-2"></i> Skills</a></li>
            <li><a href="projects.html"><i data-lucide="folder-git-2"></i> Projects</a></li>
            <li><a href="certificates.html"><i data-lucide="award"></i> Certificates</a></li>
            <li><a href="videos.html"><i data-lucide="video"></i> Videos</a></li>
            <li><a href="blog.html" class="active"><i data-lucide="newspaper"></i> Blog</a></li>
        </ul>
    </nav>

    <main class="page-container container">
        <section id="homeView">
            <h1 class="page-title"><i data-lucide="newspaper"></i> Catatan & Artikel Blog</h1>

            <div class="blog-toolbar">
                <div class="blog-search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="searchInput" placeholder="Cari judul atau kata kunci artikel...">
                </div>
                <div class="blog-categories" id="chips"></div>
            </div>

            <div class="blog-grid" id="blogGrid"></div>
            <div class="pagination-container" id="pagination"></div>
        </section>

        <section id="postView" style="display: none;">
            <a href="#" class="back-btn"><i data-lucide="arrow-left"></i> Kembali ke Daftar Artikel</a>
            <article class="post-detail-wrapper">
                <h1 id="postTitle" style="font-size: 1.8rem; color: #f8fafc; line-height: 1.3;"></h1>
                <div class="blog-meta" style="margin-top: 12px;" id="postMeta"></div>
                <img id="postCover" class="post-detail-cover" src="" alt="Cover Artikel">
                <div class="post-prose" id="postBody"></div>
                <div class="post-tags" id="postTags"></div>
            </article>
        </section>
    </main>

    <div id="aiWidgetContainer"></div>

    <script src="js/ai-assistant.js"></script>
    <script src="js/blog/blog-data.js"></script>
    <script src="js/blog/blog.js"></script>
</body>
</html>
