    <!-- Anti-Flash Script (Deteksi Tema Sistem/Storage) -->
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', saved || system);
        })();
    </script>

    <!-- Lucide Icons & CSS Utama -->

    <style>
        /* Styling Toolbar Search Video */
        .video-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .video-search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
            max-width: 360px;
            display: flex;
            align-items: center;
        }

        .video-search-box input {
            width: 100%;
            padding: 8px 14px 8px 38px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .video-search-box input:focus {
            border-color: var(--primary-color);
        }

        .video-search-box [data-lucide] {
            position: absolute !important;
            left: 12px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            color: var(--text-dim) !important;
            width: 16px !important;
            height: 16px !important;
            pointer-events: none;
        }

        /* Grid Video Cards Compact */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
            min-height: 350px;
        }

        .video-card {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.12);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-card-body {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .video-card-title {
            font-size: 0.98rem;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-color);
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.2s ease;
        }

        .video-card:hover .video-card-title {
            color: var(--primary-color);
        }

        .video-card-desc {
            font-size: 0.82rem;
            color: var(--text-dim);
            line-height: 1.45;
            margin: 0;
            text-align: justify;
            text-justify: inter-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Penyesuaian Responsif HP */
        @media (max-width: 600px) {
            .video-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .video-card-body {
                padding: 12px 14px;
            }
        }
    </style>
</head>

            }

        const videoContainer = document.getElementById("videoContainer");

        function renderVideos(list) {
            if (!videoContainer) return;
            videoContainer.innerHTML = "";

            if (list.length === 0) {
                videoContainer.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:var(--text-dim); padding:40px;">Video tidak ditemukan.</div>`;
                return;
            }

            list.forEach(v => {
                const card = document.createElement("div");
                card.className = "video-card";
                card.innerHTML = `
                    <div class="video-wrapper">
                        <iframe src="${v.url}" title="${v.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                    </div>
                    <div class="video-card-body">
                        <h3 class="video-card-title">${v.title}</h3>
                        <p class="video-card-desc">${v.desc}</p>
                    </div>
                `;
                videoContainer.appendChild(card);
            });

            if (typeof lucide !== "undefined") {
                lucide.createIcons();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderVideos(videos);

            const searchInput = document.getElementById("searchInput");
            if (searchInput) {
                searchInput.addEventListener("input", (e) => {
                    const keyword = e.target.value.toLowerCase().trim();
                    const filtered = videos.filter(v => 
                        v.title.toLowerCase().includes(keyword) || 
                        v.desc.toLowerCase().includes(keyword)
                    );
                    renderVideos(filtered);
                });
            }
        });
